<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rajshahi Bhojnalay | Admin Login</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">🍽️</div>

            <h1>Mess Management</h1>

            <p class="subtitle">RAJSHAHI BHOJNALAY PADAMPURA<br>Admin Portal</p>

            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


                <p id="loginMessage" role="status" aria-live="polite"></p>

            </form>

        </div>

    </div>


    <script src="assets/js/app.js"></script>
    
</body>
</html>
